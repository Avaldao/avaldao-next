<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo aval para evaluar</title>
</head>
<body style="margin:0;padding:0;background-color:#f2f4f6;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color:#f2f4f6;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:12px;border:1px solid #e0dce8;">
        <tr>
          <td align="center" style="background-color:#f7f9fb;padding:28px 24px;border-radius:12px 12px 0 0;">
            <span style="font-size:26px;font-weight:700;color:#630ed4;letter-spacing:-0.5px;">AvalDAO</span>
          </td>
        </tr>
        <tr>
          <td style="padding:36px 40px 8px;">
            <h1 style="margin:0 0 12px;font-size:22px;color:#191c1e;">Nuevo aval para evaluar</h1>
            <p style="margin:0 0 20px;font-size:15px;color:#4a4455;line-height:1.6;">Se registró una nueva solicitud de aval en AvalDAO que requiere tu evaluación.</p>
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="border-top:1px solid #e0dce8;border-bottom:1px solid #e0dce8;">
              <tr><td style="padding:8px 0;font-size:13px;color:#7b7487;width:130px;">Proyecto</td><td style="padding:8px 0;font-size:14px;color:#191c1e;font-weight:600;">{{PROJECT}}</td></tr>
              <tr><td style="padding:8px 0;font-size:13px;color:#7b7487;width:130px;">Solicitante</td><td style="padding:8px 0;font-size:14px;color:#191c1e;font-weight:600;">{{REQUESTER}}</td></tr>
              <tr><td style="padding:8px 0;font-size:13px;color:#7b7487;width:130px;">Monto (USD)</td><td style="padding:8px 0;font-size:14px;color:#191c1e;font-weight:600;">{{AMOUNT}}</td></tr>
              <tr><td style="padding:8px 0;font-size:13px;color:#7b7487;width:130px;">Cuotas</td><td style="padding:8px 0;font-size:14px;color:#191c1e;font-weight:600;">{{INSTALLMENTS}}</td></tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:28px 40px 36px;">
            <a href="{{AVAL_LINK}}" style="display:inline-block;padding:14px 36px;background-color:#7c3aed;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;border-radius:8px;">Evaluar aval</a>
          </td>
        </tr>
        <tr>
          <td align="center" style="background-color:#f2f4f6;padding:20px 40px;border-top:1px solid #e0dce8;border-radius:0 0 12px 12px;">
            <p style="margin:0;font-size:11px;color:#7b7487;line-height:1.6;">Este es un mensaje automático, por favor no respondas directamente a este correo.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
