name: Deploy

on:
  push:
    branches:
      - main

# Evita que dos deploys corran al mismo tiempo
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Usá la misma versión que en el servidor (node -v)
          cache: npm

      - name: Install
        run: npm install

      - name: Build
        run: |
          export NEXT_PUBLIC_COMMIT=$(git rev-parse --short HEAD)
          npm run build
        env:
          # Las NEXT_PUBLIC_* se incrustan al compilar: cargalas como secrets
          # NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NODE_ENV: production

      - name: Package standalone
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/
          if [ -d public ]; then cp -r public .next/standalone/; fi
          if [ -d emails ]; then cp -r emails .next/standalone/; fi
          tar -czf release.tar.gz -C .next/standalone .

      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: release.tar.gz
          target: /tmp/avaldao-deploy

      - name: Activate release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e

            # Cargar node/pm2 si están instalados con nvm
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            BASE=/home/deploy/avaldao
            RELEASE=$BASE/releases/$(date +%s)

            # Seguridad: current tiene que ser un symlink
            if [ -e "$BASE/current" ] && [ ! -L "$BASE/current" ]; then
              echo "ERROR: $BASE/current no es un symlink, revisar a mano"
              exit 1
            fi

            mkdir -p "$RELEASE"
            tar -xzf /tmp/avaldao-deploy/release.tar.gz -C "$RELEASE"
            rm -rf /tmp/avaldao-deploy

            # Copiar los .env de la release actual a la nueva
            cp -a "$BASE"/current/.env* "$RELEASE"/ 2>/dev/null || true

            # Activar la nueva release
            ln -sfn "$RELEASE" "$BASE/current"

            pm2 reload avaldao || pm2 start "$BASE/current/server.js" --name avaldao
            pm2 save

            # Mantener solo las últimas 5 releases
            cd "$BASE/releases" && ls -1t | tail -n +6 | xargs -r rm -rf

            echo "Deploy OK: $RELEASE"

      - name: Notify Telegram
        if: success()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT="✅ <b>Avaldao desplegado exitosamente</b>
          Commit: <code>${GITHUB_SHA::7}</code>
          Autor: ${GITHUB_ACTOR}
          <a href=\"${RUN_URL}\">Ver ejecución</a>"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode chat_id="${CHAT_ID}" \
            --data-urlencode text="${TEXT}" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true

      - name: Notify Telegram Failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT="❌ <b>Falló el deploy de Avaldao</b>
          Commit: <code>${GITHUB_SHA::7}</code>
          Autor: ${GITHUB_ACTOR}
          <a href=\"${RUN_URL}\">Ver logs</a>"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode chat_id="${CHAT_ID}" \
            --data-urlencode text="${TEXT}" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true